version: "3.9"
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dalphin_db
      DB_USER: postgres
      DB_PASSWORD: root
      OPENAI_API_KEY: key
      OPENAI_MODEL: gpt-4-turbo
      OPENAI_TEMPERATURE: 0.0
      FAISS_INDEX_PATH: /app/storage/faiss_index
      APP_ENV: development
      LOG_LEVEL: INFO
      DEBUG_MODE: "false"
    depends_on:
      - db
    volumes:
      - faiss_data:/app/storage
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: marine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_password_here
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
  faiss_data:
